<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Nước Nhanh - Water Delivery</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00e676;
            --accent-hover: #00c853;
            --border-color: #333333;
            --danger-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .cart-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Danh sách sản phẩm */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .product-info h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .add-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .add-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Giỏ hàng & Form đặt hàng */
        .cart-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .cart-section h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .cart-items {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-item-controls button {
            background: #333;
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            color: var(--accent-color);
        }

        .checkout-form input, .checkout-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
        }

        .checkout-form input:focus, .checkout-form textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .submit-order-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-order-btn:hover {
            background-color: var(--accent-hover);
        }

        .empty-cart {
            text-align: center;
            color: #777;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>💧 Đặt Nước Nhanh</h1>
        <button class="cart-btn" onclick="scrollToCart()">
            🛒 Giỏ hàng (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="main-container">
        <!-- Danh sách sản phẩm -->
        <div>
            <h2 style="margin-bottom: 15px; font-size: 1.4rem;">Danh Sách Sản Phẩm</h2>
            <div class="products-grid" id="product-list">
                <!-- Sản phẩm sẽ được render bằng JavaScript -->
            </div>
        </div>

        <!-- Giỏ hàng & Thanh toán -->
        <div class="cart-section" id="cart-section">
            <h2>Giỏ Hàng Của Bạn</h2>
            <ul class="cart-items" id="cart-items">
                <li class="empty-cart">Giỏ hàng trống</li>
            </ul>

            <div class="cart-total">
                <span>Tổng tiền:</span>
                <span id="total-price">0 đ</span>
            </div>

            <div class="checkout-form">
                <h3 style="font-size: 1rem; margin-bottom: 8px;">Thông tin giao hàng</h3>
                <input type="text" id="customer-name" placeholder="Họ và tên người nhận">
                <input type="tel" id="customer-phone" placeholder="Số điện thoại liên hệ">
                <textarea id="customer-address" rows="3" placeholder="Địa chỉ giao hàng chi tiết"></textarea>
                <button class="submit-order-btn" onclick="submitOrder()">Gửi Đơn Hàng</button>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu sản phẩm mẫu
        const products = [
            { id: 1, name: "Bình Nước Khoáng Lavie 19L", price: 65000 },
            { id: 2, name: "Bình Nước Tinh Khiết Vihawa 20L", price: 55000 },
            { id: 3, name: "Thùng Nước Suối Aquafina 500ml (24 chai)", price: 105000 },
            { id: 4, name: "Thùng Nước Dasani 500ml (24 chai)", price: 95000 },
            { id: 5, name: "Lốc 6 Chai Nước Ion Life 1.25L", price: 60000 },
            { id: 6, name: "Bình Nước Ion Life 19L", price: 85000 }
        ];

        // Lấy giỏ hàng từ LocalStorage hoặc khởi tạo mảng rỗng
        let cart = JSON.parse(localStorage.getItem('water_cart')) || [];

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="product-price">${p.price.toLocaleString()} đ</div>
                    </div>
                    <button class="add-btn" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('water_cart', JSON.stringify(cart));
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const totalPrice = document.getElementById('total-price');

            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItems.innerHTML = '<li class="empty-cart">Giỏ hàng trống</li>';
                totalPrice.textContent = '0 đ';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <li class="cart-item">
                        <span>${item.name}</span>
                        <div class="cart-item-controls">
                            <button onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </li>
                `;
            }).join('');

            totalPrice.textContent = total.toLocaleString() + ' đ';
        }

        function scrollToCart() {
            document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' });
        }

        function submitOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (cart.length === 0) {
                alert('Vui lòng chọn ít nhất một sản phẩm!');
                return;
            }
            if (!name || !phone || !address) {
                alert('Vui lòng điền đầy đủ thông tin giao hàng (Tên, SĐT, Địa chỉ)!');
                return;
            }

            // Tạo nội dung thông tin đơn hàng để gửi hoặc xử lý tiếp
            let orderSummary = `--- ĐƠN ĐẶT NƯỚC ---\n`;
            orderSummary += `Khách hàng: ${name}\n`;
            orderSummary += `Số điện thoại: ${phone}\n`;
            orderSummary += `Địa chỉ: ${address}\n\nChi tiết:\n`;
            
            let total = 0;
            cart.forEach(item => {
                orderSummary += `- ${item.name} x${item.quantity} (${(item.price * item.quantity).toLocaleString()}đ)\n`;
                total += item.price * item.quantity;
            });
            orderSummary += `\nTổng tiền: ${total.toLocaleString()} đ`;

            alert('Đặt hàng thành công! Cảm ơn bạn.\nChúng tôi sẽ liên hệ sớm nhất.');
            
            // Xóa giỏ hàng sau khi đặt thành công
            cart = [];
            updateCart();
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            document.getElementById('customer-address').value = '';
        }

        // Khởi chạy khi tải trang
        renderProducts();
        updateCart();
    </script>
</body>
</html>
