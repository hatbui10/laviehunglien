<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tra Cứu Khách Hàng - Cuộc Gọi Đến</title>
    <!-- Thư viện đọc file Excel SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 8px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn-upload {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            display: block;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: opacity 0.2s;
        }
        .btn-upload:active {
            opacity: 0.8;
        }
        .upload-wrapper input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }
        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
            word-break: break-word;
        }
        .live-call-box {
            background: linear-gradient(145deg, #182232, #1e293b);
            border: 2px solid var(--accent-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 12px;
        }
        .phone-display {
            font-size: 26px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.5px;
            margin: 4px 0;
        }
        .call-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        /* Lưới hiển thị động tất cả các cột */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .info-item {
            background: #111827;
            padding: 10px 12px;
            border-radius: 10px;
            border-left: 3.5px solid var(--accent-color);
        }
        .info-item label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-item span {
            font-size: 14px;
            font-weight: 700;
            word-break: break-word;
        }
        .full-width {
            grid-column: span 2;
        }
        .new-customer {
            border-left-color: var(--danger-color) !important;
            color: #fca5a5 !important;
        }
        /* Lịch sử cuộc gọi mobile */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            background: #111827;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }
        .history-phone {
            font-weight: 700;
            color: #fbbf24;
            font-size: 14px;
        }
        .history-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .empty-history {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span>📱 Tra Cứu Cuộc Gọi Đến</span>
    </div>

    <!-- Phần 1: Tải file Excel -->
    <div class="card">
        <div class="card-title">📁 Dữ Liệu Khách Hàng</div>
        <div class="upload-wrapper">
            <div class="btn-upload" id="uploadBtnText">📂 Chọn File Excel Khách Hàng</div>
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
        </div>
        <div class="status-msg" id="uploadStatus">Đang tải dữ liệu...</div>
    </div>

    <!-- Phần 2: Thông tin cuộc gọi mới nhất (Tự động sinh ra toàn bộ cột) -->
    <div class="card">
        <div class="card-title">📞 Cuộc Gọi Gần Nhất</div>
        <div class="live-call-box">
            <div style="font-size: 12px; color: var(--text-muted);">SỐ ĐIỆN THOẠI GỌI ĐẾN</div>
            <div class="phone-display" id="phoneNumber">Đang chờ...</div>
            <div class="call-time" id="callTime">Thời gian: ---</div>
        </div>

        <!-- Khung chứa động tất cả các cột từ Excel -->
        <div class="info-grid" id="dynamicInfoContainer">
            <div class="info-item full-width">
                <label>Trạng thái</label>
                <span id="cusStatusText">Chưa có dữ liệu cuộc gọi</span>
            </div>
        </div>
    </div>

    <!-- Phần 3: Lịch sử cuộc gọi -->
    <div class="card">
        <div class="card-title">📋 Lịch Sử Cuộc Gọi Trong Ngày</div>
        <div class="history-list" id="historyListContainer">
            <div class="empty-history">Chưa có cuộc gọi nào trong phiên này.</div>
        </div>
    </div>
</div>

<script>
    let customerDatabase = {}; 
    let lastProcessedPhone = "";

    // Làm sạch số điện thoại để làm khóa chính (Key) đối chiếu
    function cleanPhone(phoneStr) {
        if (!phoneStr) return "";
        let digits = String(phoneStr).replace(/\D/g, ""); 
        if (digits.startsWith("84")) digits = digits.substring(2);
        if (digits.startsWith("0")) digits = digits.substring(1);
        return digits;
    }

    // Định dạng số điện thoại hiển thị xxxx.xxx.xxx
    function formatPhoneNumber(phoneStr) {
        if (!phoneStr) return "";
        let digits = String(phoneStr).replace(/\D/g, "");
        if (digits.length === 10) {
            return digits.replace(/(\d{4})(\d{3})(\d{3})/, "$1.$2.$3");
        } else if (digits.length === 11) {
            return digits.replace(/(\d{4})(\d{3})(\d{4})/, "$1.$2.$4");
        }
        return phoneStr;
    }

    // Xử lý nạp toàn bộ các cột từ các dòng Excel vào bộ nhớ
    function processJsonRows(jsonRows) {
        customerDatabase = {};
        let count = 0;

        jsonRows.forEach(row => {
            // Tự động tìm cột nào có chứa từ khóa điện thoại làm khóa chính
            let rawPhone = "";
            for (let key of Object.keys(row)) {
                let lowerKey = key.trim().toLowerCase();
                if (lowerKey.includes('điện thoại') || lowerKey.includes('sđt') || lowerKey.includes('phone')) {
                    rawPhone = row[key];
                    break;
                }
            }

            let key = cleanPhone(rawPhone);
            if (key) {
                // Lưu lại nguyên vẹn toàn bộ các cột của dòng đó vào object
                customerDatabase[key] = row;
                count++;
            }
        });

        return count;
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById("uploadBtnText").innerText = "📂 " + file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const jsonRows = XLSX.utils.sheet_to_json(worksheet);
            let count = processJsonRows(jsonRows);

            try {
                localStorage.setItem('savedCustomerData', JSON.stringify(jsonRows));
                localStorage.setItem('savedFileName', file.name);
            } catch (err) {
                console.log("Dung lượng vượt giới hạn lưu trữ.");
            }

            document.getElementById("uploadStatus").innerText = `Đã nạp thành công ${count} khách hàng với toàn bộ các cột!`;
        };
        reader.readAsArrayBuffer(file);
    }

    window.onload = function() {
        const savedData = localStorage.getItem('savedCustomerData');
        const savedName = localStorage.getItem('savedFileName');
        if (savedData) {
            try {
                const jsonRows = JSON.parse(savedData);
                let count = processJsonRows(jsonRows);
                if (savedName) {
                    document.getElementById("uploadBtnText").innerText = "📂 " + savedName;
                }
                document.getElementById("uploadStatus").innerText = `Đã tự động nạp sẵn ${count} khách hàng từ bộ nhớ!`;
            } catch (e) {
                document.getElementById("uploadStatus").innerText = "Chưa chọn file Excel. Vui lòng bấm chọn file.";
            }
        } else {
            document.getElementById("uploadStatus").innerText = "Chưa chọn file Excel. Vui lòng bấm chọn file.";
        }
    };

    // Hàm render động tất cả các cột ra giao diện
    function renderCustomerInfo(customerObj, formattedPhone, isNew) {
        const container = document.getElementById("dynamicInfoContainer");
        container.innerHTML = "";

        if (isNew || !customerObj) {
            container.innerHTML = `
                <div class="info-item full-width new-customer">
                    <label>Trạng thái</label>
                    <span>⚠️ Khách Hàng Mới (Không có trong Excel)</span>
                </div>
                <div class="info-item full-width">
                    <label>Số Điện Thoại</label>
                    <span>${formattedPhone}</span>
                </div>
            `;
            return;
        }

        // Duyệt qua tất cả các tiêu đề cột (tối đa 20 cột hoặc bao nhiêu cũng được)
        for (let [columnTitle, cellValue] of Object.entries(customerObj)) {
            let itemDiv = document.createElement("div");
            itemDiv.className = "info-item";
            
            // Nếu nội dung dài thì cho chiếm trọn 2 cột ngang của lưới
            let stringVal = String(cellValue || '---');
            if (stringVal.length > 25 || columnTitle.toLowerCase().includes('địa chỉ') || columnTitle.toLowerCase().includes('ghi chú')) {
                itemDiv.classList.add("full-width");
            }

            itemDiv.innerHTML = `
                <label>${columnTitle}</label>
                <span>${stringVal}</span>
            `;
            container.appendChild(itemDiv);
        }
    }

    function addHistoryItem(time, phoneFormatted, customerObj, isNew) {
        const container = document.getElementById("historyListContainer");
        
        if (container.querySelector('.empty-history')) {
            container.innerHTML = "";
        }

        const item = document.createElement("div");
        item.className = "history-item";
        
        let summaryText = isNew ? "⚠️ Khách hàng mới" : "";
        if (!isNew && customerObj) {
            // Lấy đại diện 1-2 trường thông tin đầu tiên (như Tên hoặc Mã) làm tóm tắt lịch sử
            let keys = Object.keys(customerObj);
            let firstVal = customerObj[keys[0]] || "";
            let secondVal = customerObj[keys[1]] || "";
            summaryText = `[${firstVal}] ${secondVal}`;
        }

        item.innerHTML = `
            <div class="history-header">
                <span class="history-phone">${phoneFormatted}</span>
                <span>${time}</span>
            </div>
            <div style="font-weight: 600; color: ${isNew ? '#fca5a5' : '#f8fafc'}; font-size: 13px;">${summaryText}</div>
        `;

        container.prepend(item);
    }

    async function checkIncomingCallFromFirebase() {
        const url = "https://firestore.googleapis.com/v1/projects/laviehunglien-1f741/databases/(default)/documents/incoming_call/current";
        try {
            let response = await fetch(url);
            let data = await response.json();
            
            if (data && data.fields) {
                let rawIncomingPhone = data.fields.phone.stringValue.trim();
                let time = data.fields.time.stringValue;

                if (time.includes("[day]")) {
                    let today = new Date().getDate();
                    time = time.replace("[day]", today);
                }

                let uniqueCallIdentifier = rawIncomingPhone + "_" + time;
                if (uniqueCallIdentifier !== lastProcessedPhone) {
                    lastProcessedPhone = uniqueCallIdentifier;

                    let formattedPhone = formatPhoneNumber(rawIncomingPhone);

                    document.getElementById("phoneNumber").innerText = formattedPhone;
                    document.getElementById("callTime").innerText = "Thời gian: " + time;

                    let searchKey = cleanPhone(rawIncomingPhone);
                    let customerObj = customerDatabase[searchKey];
                    let isNew = !customerObj;

                    // Gọi hàm tự động tạo giao diện cho toàn bộ các cột
                    renderCustomerInfo(customerObj, formattedPhone, isNew);

                    // Thêm vào lịch sử
                    addHistoryItem(time, formattedPhone, customerObj, isNew);
                }
            }
        } catch (error) {
            console.error("Đang chờ kết nối từ Firebase...", error);
        }
    }

    setInterval(checkIncomingCallFromFirebase, 3000);
</script>

</body>
</html>
