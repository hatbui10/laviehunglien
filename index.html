<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tra Cứu Khách Hàng - Cuộc Gọi Đến</title>
    <!-- Thư viện đọc file Excel SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent-color: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.4);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --danger-color: #ef4444;
        --badge-bg: #334155;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 580px;
    }

    .header-title {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: var(--accent-color);
        margin: 8px 0 16px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 8px;
        margin-bottom: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 8px;
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .upload-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
    }

    .btn-upload {
        background: linear-gradient(135deg, #059669, #10b981);
        color: white;
        padding: 8px 8px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 18px;
        text-align: center;
        display: block;
        cursor: pointer;
        box-shadow: 0 4px 12px var(--accent-glow);
        transition: opacity 0.2s;
    }

    .btn-upload:active {
        opacity: 0.8;
    }

    .upload-wrapper input[type="file"] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        height: 100%;
        width: 100%;
    }

    .status-msg {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 8px;
        text-align: center;
        word-break: break-word;
    }

    .live-call-box {
        background: linear-gradient(145deg, #182232, #1e293b);
        border: 2px solid var(--accent-color);
        border-radius: 14px;
        padding: 14px;
        text-align: center;
        box-shadow: 0 0 15px var(--accent-glow);
        margin-bottom: 12px;
    }

    .phone-display {
        font-size: 26px;
        font-weight: 800;
        color: #fbbf24;
        letter-spacing: 0.5px;
        margin: 4px 0;
    }

    .call-time {
        font-size: 12px;
        color: var(--text-muted);
    }

    @keyframes glowingBtn {
        0% {
            transform: scale(1);
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.4), 0 0 10px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.6);
        }
        50% {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8), 0 0 30px rgba(52, 211, 153, 0.5);
            border-color: rgba(52, 211, 153, 1);
        }
        100% {
            transform: scale(1);
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.4), 0 0 10px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.6);
        }
    }

    .btn-call-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(135deg, #059669, #10b981);
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 700;
        margin-top: 10px;
        border: 2px solid #34d399;
        animation: glowingBtn 1.8s infinite ease-in-out;
        transition: opacity 0.2s;
    }

    .btn-call-action:active {
        opacity: 0.8;
        transform: scale(0.97);
    }









    /* --- GIAO DIỆN THẺ THÔNG TIN KHÁCH HÀNG TỐI ƯU CHO MOBILE --- */
        .single-card-title {
        font-size: 14px;
        font-weight: 700;
        color: #f8fafc;
        padding: 3px 0 10px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.6);
        margin-bottom: 0;
    }

    .github-row {
        display: flex;
        flex-direction: row; /* Đặt nằm ngang trên cùng một dòng */
        justify-content: space-between; /* Đẩy tiêu đề sang trái, nội dung sang phải */
        align-items: center; /* Căn giữa theo chiều dọc của ô */
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.3);
    }

    .github-row:last-child {
        border-bottom: none;
    }

    /* Tiêu đề nằm bên trái (hoặc căn giữa tuỳ ý) */
    .github-row-title {
        font-size: 11px;
        font-weight: 700;
        color: #34d399;
        letter-spacing: 0.5px;
        text-align: left;
        flex-shrink: 0;
    }

    /* Nội dung được căn lề phải chính xác */
    .github-row-action {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
        text-align: right; /* Căn lề phải */
        word-break: break-word;
        overflow-wrap: break-word;
        line-height: 1.4;
    }








    /* -------------------------------------------------------- */

    .history-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 300px;
        overflow-y: auto;
    }

    .history-item {
        background: #111827;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
    }

    .history-left {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .history-phone {
        font-weight: 700;
        color: #fbbf24;
        font-size: 14px;
        text-decoration: none;
    }

    .history-phone:hover {
        text-decoration: underline;
    }

    .call-count-badge {
        background-color: var(--badge-bg);
        color: #34d399;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid #475569;
    }

    .empty-history {
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        padding: 16px;
    }

    .btn-clear {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 6px;
        cursor: pointer;
    }

    .btn-clear:hover {
        background: var(--danger-color);
        color: white;
        border-color: var(--danger-color);
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span>📱 Tra Cứu Cuộc Gọi Đến</span>
    </div>

    <div class="card">
        <div class="card-title">📁 Dữ Liệu Khách Hàng</div>
        <div class="upload-wrapper">
            <div class="btn-upload" id="uploadBtnText">📂 Chọn File Excel Khách Hàng</div>
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
        </div>
        <div class="status-msg" id="uploadStatus">Đang tải dữ liệu...</div>
    </div>

    <div class="card">
        <div class="card-title">📞 Cuộc Gọi Gần Nhất</div>
        <div class="live-call-box">
            <div style="font-size: 12px; color: var(--text-muted);">SỐ ĐIỆN THOẠI GỌI ĐẾN</div>
            <div class="phone-display" id="phoneNumber">Đang chờ...</div>
            <div class="call-time" id="callTime">Thời gian: ---</div>
            <div id="callActionContainer"></div>
        </div>

        <div class="info-grid" id="dynamicInfoContainer">
            <div class="info-item full-width">
                <label>Trạng thái</label>
                <span id="cusStatusText">Chưa có dữ liệu cuộc gọi</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>📋 Lịch Sử Cuộc Gọi</span>
            <button class="btn-clear" onclick="clearHistory()">Xóa lịch sử</button>
        </div>
        <div class="history-list" id="historyListContainer">
            <div class="empty-history">Chưa có cuộc gọi nào trong phiên này.</div>
        </div>
    </div>
</div>

<script>
    let customerDatabase = {}; 
    let callHistoryArray = [];

    function cleanPhone(phoneStr) {
        if (!phoneStr) return "";
        let digits = String(phoneStr).replace(/\D/g, ""); 
        if (digits.startsWith("84") && digits.length > 10) digits = digits.substring(2);
        if (digits.startsWith("0")) digits = digits.substring(1);
        return digits;
    }

    function formatPhoneNumber(phoneStr) {
        if (!phoneStr) return "";
        let digits = String(phoneStr).replace(/\D/g, "");
        if (digits.length === 10) {
            return digits.replace(/(\d{4})(\d{3})(\d{3})/, "$1.$2.$3");
        } else if (digits.length === 11) {
            return digits.replace(/(\d{4})(\d{3})(\d{4})/, "$1.$2.$4");
        }
        return phoneStr;
    }

    function processJsonRows(jsonRows) {
        customerDatabase = {};
        let count = 0;

        jsonRows.forEach(row => {
            let cleanRow = {};
            let rawPhone = "";
            
            for (let key of Object.keys(row)) {
                let cleanKey = key.trim();
                cleanRow[cleanKey] = row[key];
                
                let lowerKey = cleanKey.toLowerCase();
                if (lowerKey.includes('điện thoại') || lowerKey.includes('sđt') || lowerKey.includes('phone')) {
                    rawPhone = row[key];
                }
            }

            let key = cleanPhone(rawPhone);
            if (key) {
                customerDatabase[key] = cleanRow;
                count++;
            }
        });

        return count;
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById("uploadBtnText").innerText = "📂 " + file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const jsonRows = XLSX.utils.sheet_to_json(worksheet);
            let count = processJsonRows(jsonRows);

            try {
                localStorage.setItem('savedCustomerData', JSON.stringify(jsonRows));
                localStorage.setItem('savedFileName', file.name);
            } catch (err) {}

            document.getElementById("uploadStatus").innerText = `Đã nạp thành công ${count} khách hàng!`;
            renderHistoryUI();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderCustomerInfo(customerObj, formattedPhone, isNew) {
        const container = document.getElementById("dynamicInfoContainer");
        container.innerHTML = "";

        let cardDiv = document.createElement("div");
        cardDiv.className = "single-customer-card";

        let htmlContent = `<div class="single-card-title">📋 THÔNG TIN CHI TIẾT KHÁCH HÀNG</div>`;

        if (isNew || !customerObj) {
            htmlContent += `
                <div class="github-row">
                    <span class="github-row-title" style="color: #fca5a5;">TRẠNG THÁI</span>
                    <span class="github-row-action" style="color: #fca5a5;">KHÁCH HÀNG MỚI (KHÔNG CÓ TRONG EXCEL)</span>
                </div>
                <div class="github-row">
                    <span class="github-row-title">SỐ ĐIỆN THOẠI</span>
                    <span class="github-row-action">${formattedPhone}</span>
                </div>
            `;
        } else {
            for (let [columnTitle, cellValue] of Object.entries(customerObj)) {
                let stringVal = String(cellValue !== undefined && cellValue !== null ? cellValue : '---');
                let upperTitle = columnTitle.toUpperCase();
                
                htmlContent += `
                    <div class="github-row">
                        <span class="github-row-title">${upperTitle}</span>
                        <span class="github-row-action">${stringVal}</span>
                    </div>
                `;
            }
        }

        cardDiv.innerHTML = htmlContent;
        container.appendChild(cardDiv);
    }

    function saveHistoryToStorage() {
        try {
            localStorage.setItem('callHistoryList', JSON.stringify(callHistoryArray));
        } catch(e) {}
    }

    function renderHistoryUI() {
        const container = document.getElementById("historyListContainer");
        container.innerHTML = "";

        if (callHistoryArray.length === 0) {
            container.innerHTML = `<div class="empty-history">Chưa có cuộc gọi nào trong phiên này.</div>`;
            return;
        }

        callHistoryArray.forEach(item => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "history-item";
            
            let searchKey = cleanPhone(item.rawPhone);
            let customerObj = customerDatabase[searchKey];
            let isNew = !customerObj;

            let summaryText = isNew ? "⚠️ Khách hàng mới" : "";
            if (!isNew && customerObj) {
                let keys = Object.keys(customerObj);
                let firstVal = customerObj[keys[0]] || "";
                let secondVal = customerObj[keys[1]] || "";
                summaryText = `[${firstVal}] ${secondVal}`;
            }

            itemDiv.innerHTML = `
                <div class="history-header">
                    <div class="history-left">
                        <a href="tel:${item.rawPhone}" class="history-phone">📞 ${item.phoneFormatted}</a>
                        <span class="call-count-badge">Gọi ${item.count || 1} lần</span>
                    </div>
                    <span>${item.time}</span>
                </div>
                <div style="font-weight: 600; color: ${isNew ? '#fca5a5' : '#f8fafc'}; font-size: 13px;">${summaryText}</div>
            `;
            container.appendChild(itemDiv);
        });
    }

    function clearHistory() {
        if (confirm("Bạn có muốn xóa toàn bộ lịch sử cuộc gọi không?")) {
            callHistoryArray = [];
            localStorage.removeItem('callHistoryList');
            renderHistoryUI();
        }
    }

    window.onload = function() {
        const savedData = localStorage.getItem('savedCustomerData');
        const savedName = localStorage.getItem('savedFileName');
        if (savedData) {
            try {
                const jsonRows = JSON.parse(savedData);
                let count = processJsonRows(jsonRows);
                if (savedName) {
                    document.getElementById("uploadBtnText").innerText = "📂 " + savedName;
                }
                document.getElementById("uploadStatus").innerText = `Đã tự động nạp sẵn ${count} khách hàng từ bộ nhớ!`;
            } catch (e) {}
        } else {
            document.getElementById("uploadStatus").innerText = "Chưa chọn file Excel. Vui lòng bấm chọn file.";
        }

        const savedHistory = localStorage.getItem('callHistoryList');
        if (savedHistory) {
            try {
                callHistoryArray = JSON.parse(savedHistory);
                renderHistoryUI();
                if (callHistoryArray.length > 0) {
                    let latest = callHistoryArray[0];
                    document.getElementById("phoneNumber").innerText = latest.phoneFormatted;
                    document.getElementById("callTime").innerText = "Thời gian gần nhất: " + latest.time;
                    document.getElementById("callActionContainer").innerHTML = `
                        <a href="tel:${latest.rawPhone}" class="btn-call-action">
                            <span>📞 Gọi Lại Ngay</span>
                        </a>
                    `;
                    let searchKey = cleanPhone(latest.rawPhone);
                    renderCustomerInfo(customerDatabase[searchKey], latest.phoneFormatted, !customerDatabase[searchKey]);
                }
            } catch(e) {}
        }
    };

    let lastProcessedPhone = "";

    async function checkIncomingCallFromFirebase() {
        const url = "https://firestore.googleapis.com/v1/projects/laviehunglien-1f741/databases/(default)/documents/incoming_call/current";
        try {
            let response = await fetch(url);
            let data = await response.json();
            
            if (data && data.fields) {
                let rawIncomingPhone = data.fields.phone.stringValue.trim();
                let rawTime = data.fields.time.stringValue;

                let timeOnly = rawTime.replace(/\{day\}.*$/, '').split(' ')[0];
                if (!timeOnly || timeOnly.length < 3) timeOnly = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                
                let now = new Date();
                let currentDate = now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear();
                let time = timeOnly + " " + currentDate;

                let uniqueCallIdentifier = rawIncomingPhone + "_" + time;
                let isAlreadyLogged = callHistoryArray.length > 0 && (callHistoryArray[0].rawPhone === rawIncomingPhone && callHistoryArray[0].time === time);

                if (uniqueCallIdentifier !== lastProcessedPhone && !isAlreadyLogged) {
                    lastProcessedPhone = uniqueCallIdentifier;
                    let formattedPhone = formatPhoneNumber(rawIncomingPhone);

                    document.getElementById("phoneNumber").innerText = formattedPhone;
                    document.getElementById("callTime").innerText = "Thời gian gần nhất: " + time;

                    document.getElementById("callActionContainer").innerHTML = `
                        <a href="tel:${rawIncomingPhone}" class="btn-call-action">
                            <span>📞 Gọi Lại Ngay</span>
                        </a>
                    `;

                    let searchKey = cleanPhone(rawIncomingPhone);
                    let customerObj = customerDatabase[searchKey];
                    let isNew = !customerObj;

                    renderCustomerInfo(customerObj, formattedPhone, isNew);

                    let existingIndex = callHistoryArray.findIndex(item => cleanPhone(item.rawPhone) === cleanPhone(rawIncomingPhone));

                      if (existingIndex !== -1) {
                        callHistoryArray[existingIndex].count = (callHistoryArray[existingIndex].count || 1) + 1;
                        callHistoryArray[existingIndex].time = time;
                        let itemToMove = callHistoryArray.splice(existingIndex, 1)[0];
                        callHistoryArray.unshift(itemToMove);
                    } else {
                        callHistoryArray.unshift({
                            rawPhone: rawIncomingPhone,
                            phoneFormatted: formattedPhone,
                            time: time,
                            count: 1
                        });
                    }

                    if (callHistoryArray.length > 50) {
                        callHistoryArray.pop();
                    }

                    saveHistoryToStorage();
                    renderHistoryUI();
                }
            }
        } catch (error) {
            console.error("Đang chờ kết nối từ Firebase...", error);
        }
    }

    setInterval(checkIncomingCallFromFirebase, 3000);
</script>

</body>
</html>
