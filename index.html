<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Nước Nhanh - Quản lý nội bộ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00e676;
            --accent-hover: #00c853;
            --border-color: #333333;
            --danger-color: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.6rem;
        }

        .cart-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Danh sách sản phẩm dạng lưới */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .product-info h3 {
            font-size: 1rem;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .add-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .add-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Giỏ hàng & Form đặt hàng */
        .cart-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            height: fit-content;
        }

        .cart-section h2 {
            margin-bottom: 12px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .cart-items {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-item-controls button {
            background: #333;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Ô tổng tiền thanh toán */
        .cart-total-box {
            background-color: #252525;
            border: 1px dashed var(--accent-color);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-total-box span:first-child {
            font-weight: bold;
            color: #bbb;
            font-size: 0.9rem;
        }

        .cart-total-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .checkout-form input, .checkout-form textarea {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .checkout-form input:focus, .checkout-form textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .submit-order-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-order-btn:hover {
            background-color: var(--accent-hover);
        }

        .empty-cart {
            text-align: center;
            color: #777;
            padding: 15px 0;
            font-size: 0.9rem;
        }

        /* Khu vực quản lý đơn hàng */
        .admin-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .admin-header h2 {
            font-size: 1.2rem;
        }

        .clear-orders-btn {
            background: #333;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .clear-orders-btn:hover {
            background: var(--danger-color);
            color: #fff;
        }

        /* Bảng quản lý đơn hàng */
        table.orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
            table-layout: fixed;
            border: 1px solid var(--border-color);
        }

        table.orders-table th, table.orders-table td {
            padding: 8px 8px;
            border: 1px solid var(--border-color);
            word-wrap: break-word;
            vertical-align: middle; /* Căn giữa theo chiều dọc cho đẹp mắt */
        }

        table.orders-table th {
            color: var(--accent-color);
            font-size: 0.85rem;
            background-color: #252525;
        }

        /* Đặt SĐT và nút Gọi cùng trên 1 hàng ngang */
        .phone-cell {
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: nowrap;
        }

        .call-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #2e7d32;
            color: #ffffff;
            text-decoration: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.2s;
        }

        .call-btn:hover {
            background-color: #388e3c;
        }

        /* Tỉ lệ chiều rộng các cột (Nới rộng thêm cột SĐT) */
        .col-time { width: 13%; }
        .col-name { width: 13%; }
        .col-phone { width: 18%; } 
        .col-address { width: 27%; }
        .col-items { width: 21%; }
        .col-total { width: 8%; }
    </style>
</head>
<body>

    <header>
        <h1>💧 Đặt Nước Nhanh</h1>
        <button class="cart-btn" onclick="scrollToCart()">
            🛒 Giỏ hàng (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="main-container">
        <!-- Danh sách sản phẩm dạng lưới -->
        <div>
            <h2 style="margin-bottom: 12px; font-size: 1.3rem;">Danh Sách Sản Phẩm</h2>
            <div class="products-grid" id="product-list"></div>
        </div>

        <!-- Giỏ hàng & Form đặt hàng -->
        <div class="cart-section" id="cart-section">
            <h2>Giỏ Hàng Của Bạn</h2>
            <ul class="cart-items" id="cart-items">
                <li class="empty-cart">Giỏ hàng trống</li>
            </ul>

            <!-- Ô tổng tiền thanh toán -->
            <div class="cart-total-box">
                <span>Tổng thanh toán:</span>
                <span class="cart-total-price" id="total-price">0 đ</span>
            </div>

            <div class="checkout-form">
                <h3 style="font-size: 0.95rem; margin-bottom: 6px;">Thông tin giao hàng</h3>
                <input type="text" id="customer-name" placeholder="Họ và tên người nhận">
                <input type="tel" id="customer-phone" placeholder="Số điện thoại liên hệ" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <textarea id="customer-address" rows="3" placeholder="Địa chỉ giao hàng chi tiết (số nhà, tên đường...)"></textarea>
                <button class="submit-order-btn" onclick="submitOrder()">Gửi Đơn Hàng</button>
            </div>
        </div>
    </div>

    <!-- BẢNG QUẢN LÝ ĐƠN HÀNG -->
    <div class="admin-section">
        <div class="admin-header">
            <h2>📋 Danh Sách Đơn Hàng Đã Nhận</h2>
            <button class="clear-orders-btn" onclick="clearAllOrders()">🗑️ Xóa lịch sử</button>
        </div>
        <div style="overflow-x: auto;">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th class="col-time">Thời gian</th>
                        <th class="col-name">Họ tên</th>
                        <th class="col-phone">SĐT & Gọi</th>
                        <th class="col-address">Địa chỉ</th>
                        <th class="col-items">Sản phẩm & Giá</th>
                        <th class="col-total">Tổng</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="6" style="text-align: center; color: #777;">Chưa có đơn hàng nào.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Bình Nước Khoáng Lavie 19L", price: 65000 },
            { id: 2, name: "Bình Nước Tinh Khiết Vihawa 20L", price: 55000 },
            { id: 3, name: "Thùng Nước Suối Aquafina 500ml (24 chai)", price: 105000 },
            { id: 4, name: "Thùng Nước Dasani 500ml (24 chai)", price: 95000 },
            { id: 5, name: "Lốc 6 Chai Nước Ion Life 1.25L", price: 60000 },
            { id: 6, name: "Bình Nước Ion Life 19L", price: 85000 }
        ];

        let cart = JSON.parse(localStorage.getItem('water_cart')) || [];
        let ordersList = JSON.parse(localStorage.getItem('water_orders')) || [];

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="product-price">${p.price.toLocaleString()} đ</div>
                    </div>
                    <button class="add-btn" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('water_cart', JSON.stringify(cart));
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const totalPrice = document.getElementById('total-price');

            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItems.innerHTML = '<li class="empty-cart">Giỏ hàng trống</li>';
                totalPrice.textContent = '0 đ';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <li class="cart-item">
                        <span>${item.name}</span>
                        <div class="cart-item-controls">
                            <button onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </li>
                `;
            }).join('');

            totalPrice.textContent = total.toLocaleString() + ' đ';
        }

        function scrollToCart() {
            document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' });
        }

        function submitOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (cart.length === 0) {
                alert('Vui lòng chọn ít nhất một sản phẩm!');
                return;
            }
            if (!name || !phone || !address) {
                alert('Vui lòng điền đầy đủ thông tin giao hàng!');
                return;
            }

            let itemsText = cart.map(item => `<div style="display: flex; justify-content: space-between; gap: 4px; margin-bottom: 3px;"><span>- ${item.name} (x${item.quantity})</span><strong style="color: #00e676; white-space: nowrap;">${(item.price * item.quantity).toLocaleString()}đ</strong></div>`).join('');
            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const newOrder = {
                time: new Date().toLocaleString('vi-VN'),
                name: name,
                phone: phone,
                address: address,
                items: itemsText,
                total: total.toLocaleString() + ' đ'
            };

            ordersList.unshift(newOrder);
            localStorage.setItem('water_orders', JSON.stringify(ordersList));

            alert('Đặt hàng thành công!');
            
            cart = [];
            updateCart();
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            document.getElementById('customer-address').value = '';

            renderOrders();
        }

        function renderOrders() {
            const tableBody = document.getElementById('orders-table-body');
            if (ordersList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">Chưa có đơn hàng nào.</td></tr>`;
                return;
            }

            tableBody.innerHTML = ordersList.map(order => `
                <tr>
                    <td>${order.time}</td>
                    <td><b>${order.name}</b></td>
                    <td>
                        <div class="phone-cell">
                            <span>${order.phone}</span>
                            <a href="tel:${order.phone}" class="call-btn">📞 Gọi</a>
                        </div>
                    </td>
                    <td>${order.address}</td>
                    <td>${order.items}</td>
                    <td style="color: var(--accent-color); font-weight: bold;">${order.total}</td>
                </tr>
            `).join('');
        }

        function clearAllOrders() {
            if (confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử đơn hàng không?')) {
                ordersList = [];
                localStorage.removeItem('water_orders');
                renderOrders();
            }
        }

        renderProducts();
        updateCart();
        renderOrders();
    </script>
</body>
</html>
