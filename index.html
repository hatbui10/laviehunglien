<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hiển thị thông tin khách hàng gọi đến</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .phone { font-size: 24px; font-weight: bold; color: #2c3e50; margin: 15px 0; }
        .info { font-size: 18px; color: #e74c3c; margin-bottom: 10px; }
        .time { color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📞 Cuộc Gọi Đến</h2>
    <div class="phone" id="phoneNumber">Đang chờ cuộc gọi...</div>
    <div class="info" id="customerInfo">Thông tin: ---</div>
    <div class="time" id="callTime">---</div>
</div>

<!-- Sử dụng Firebase SDK bản mới nhất qua CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cấu hình Firebase của bạn (Lấy từ Project Settings > General > Your apps > Web app)
    const firebaseConfig = {
        projectId: "laviehunglien-1f741",
        // Nếu dùng Firestore trực tiếp qua thư viện, bạn có thể cần thêm apiKey và authDomain ở đây.
        // Tuy nhiên, cách đơn giản nhất không cần cấu hình phức tạp là dùng REST API dạng Fetch bên dưới.
    };
</script>

<!-- Cách đơn giản không cần cấu hình SDK phức tạp: Dùng vòng lặp kiểm tra (Polling) qua Fetch API -->
<script>
    // Danh sách dữ liệu khách hàng mẫu (Bạn có thể thay thế bằng database riêng của bạn hoặc gọi API công ty)
    const danhSachKhachHang = {
        "0981234567": { name: "Nguyễn Văn A - VIP", note: "Khách mua máy lọc nước" },
        "0912345678": { name: "Trần Thị B", note: "Khách hẹn bảo trì" }
    };

    async function checkIncomingCall() {
        const url = "https://firestore.googleapis.com/v1/projects/laviehunglien-1f741/databases/(default)/documents/incoming_call/current";
        try {
            let response = await fetch(url);
            let data = await response.json();
            
            if (data && data.fields) {
                let phone = data.fields.phone.stringValue;
                let time = data.fields.time.stringValue;

                document.getElementById("phoneNumber").innerText = phone;
                document.getElementById("callTime").innerText = "Thời gian: " + time;

                // Kiểm tra xem số điện thoại có trong danh sách khách hàng không
                let customer = danhSachKhachHang[phone];
                if (customer) {
                    document.getElementById("customerInfo").innerHTML = `<b>${customer.name}</b><br><small>${customer.note}</small>`;
                } else {
                    document.getElementById("customerInfo").innerText = "Khách hàng mới (Chưa có trong danh bạ)";
                }
            }
        } catch (error) {
            console.error("Lỗi lấy dữ liệu:", error);
        }
    }

    // Tự động kiểm tra cập nhật từ Firebase mỗi 3 giây
    setInterval(checkIncomingCall, 3000);
</script>

</body>
</html>
